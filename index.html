<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jeremy67</title>

    <style>
        body {
            margin: 0;
            background: #09070d;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .main {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 70px;
            margin: 0;
            color: #a875ff;
        }

            color: #aaa4b3;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            border: 0;
            border-radius: 15px;
            background: #9565ff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #7b4ee8;
        }
    </style>
</head>

<div class="main">
    <h1>jeremy67</h1>
    <p>мой первый сайт :3</p>

    <button onclick="hello()">

    </button>
</div>

        alert("67 :3");
    }
</script>

</body>
</html>
